services:
  app:
    image: stitchforge:${STITCHFORGE_RELEASE:-local}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    init: true
    network_mode: host
    env_file:
      - /opt/stitchforge/shared/production.env
    volumes:
      - /opt/stitchforge/shared/data:/data
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 2500m
    cpus: 1.5
    pids_limit: 160
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18765/api/v1/ready', timeout=5).close()"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
