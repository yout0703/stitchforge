<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1600" viewBox="0 0 1600 1600" role="img" aria-labelledby="title desc">
<title id="title">StitchForge 当前项目架构与主流程</title>
<desc id="desc">浏览器经 API 调用图片引擎，经过针距识别或参数规划、采样、DMC 配色与质量检查，保存统一的针脚文档及版本。SQLite 保存账号与元数据，文件系统保存素材。任务队列已有存储接口，但独立执行器未接入。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#78909c"/></marker></defs>
<style>text{font-family:'PingFang SC','Microsoft YaHei',sans-serif;fill:#18313d}.title{font-size:38px;font-weight:700}.sub{font-size:20px;fill:#607682}.section{font-size:24px;font-weight:650}.label{font-size:23px;font-weight:600}.detail{font-size:19px;fill:#49616c}.small{font-size:18px;fill:#607682}.edge{fill:none;stroke:#78909c;stroke-width:2.3;marker-end:url(#arrow);stroke-linejoin:round}</style>
<rect width="1600" height="1600" fill="#f6f8fb"/>

<text x="60" y="65" class="title">StitchForge · 当前架构与主流程</text>
<text x="60" y="103" class="sub">按工作区实际代码梳理 · 2026-09-13  |  核心：同一份针脚数据支撑编辑、预览与导出</text>
<rect x="60" y="135" width="1480" height="112" rx="14" fill="#eaf1ff" stroke="#b9cef1" stroke-width="1.5"/>
<text x="90" y="174" class="section">01  浏览器工作台  ·  React / TypeScript / Canvas 2D</text>
<text x="90" y="214" class="label">注册登录  →  图纸库 / 图片与 OXS 导入  →  查看、逐针编辑、原图对照  →  保存 / 下载</text>
<path d="M 800 247 V 280" class="edge"/>
<rect x="60" y="280" width="1480" height="99" rx="14" fill="#eaf1ff" stroke="#b9cef1" stroke-width="1.5"/>
<text x="90" y="319" class="section">02  FastAPI 业务入口  ·  /api/v1</text>
<text x="90" y="355" class="detail">会话与资源归属校验   ·   写请求校验   ·   请求 ID   ·   项目 / 版本 / 转换 / 下载 / 计次接口</text>
<path d="M 485 379 V 420" class="edge"/>
<path d="M 1245 379 V 420" class="edge"/>
<rect x="60" y="420" width="850" height="565" rx="14" fill="#ecf7f3" stroke="#b7dacf" stroke-width="1.5"/>
<text x="90" y="458" class="section">03  图片转换：当前由 API 同步执行</text>
<rect x="90" y="480" width="790" height="66" rx="14" fill="#ffffff" stroke="#d7e2e8" stroke-width="1.5"/>
<text x="110" y="508" class="label">输入规范化</text>
<text x="300" y="508" class="detail">校验 JPG / PNG、EXIF 方向、ICC → sRGB</text>
<text x="110" y="534" class="small">20 MiB 文件上限 / 40 MP 解码上限；保留原始素材</text>
<path d="M 485 546 V 561 H 275 V 580" class="edge"/>
<path d="M 485 561 H 695 V 580" class="edge"/>
<rect x="90" y="580" width="370" height="100" rx="14" fill="#ffffff" stroke="#d7e2e8" stroke-width="1.5"/>
<text x="110" y="615" class="label">A · 识别出原有针距</text>
<text x="110" y="645" class="detail">本地针格候选 + 可选 AI 结构复核</text>
<text x="110" y="668" class="small">无法通过必要复核 → 停止，不扣次</text>
<rect x="510" y="580" width="370" height="100" rx="14" fill="#ffffff" stroke="#d7e2e8" stroke-width="1.5"/>
<text x="530" y="615" class="label">B · 未选出针格候选</text>
<text x="530" y="645" class="detail">DeepSeek / Codex / 本地参数规划</text>
<text x="530" y="668" class="small">校验比例、格数、色数与针距证据</text>
<path d="M 275 680 V 704 H 485 V 720" class="edge"/>
<path d="M 695 680 V 704 H 485" class="edge"/>
<rect x="90" y="720" width="790" height="79" rx="14" fill="#ffffff" stroke="#d7e2e8" stroke-width="1.5"/>
<text x="110" y="752" class="label">针格与颜色准备</text>
<text x="110" y="781" class="detail">复用候选 / 网格采样 → 可选去底布、裁边、效果图浅色恢复</text>
<path d="M 485 799 V 834" class="edge"/>
<rect x="90" y="834" width="790" height="111" rx="14" fill="#ffffff" stroke="#d7e2e8" stroke-width="1.5"/>
<text x="110" y="868" class="label">DMC 配色 → 质量检查 → PatternDocument</text>
<text x="110" y="898" class="detail">普通图片：小色块优化；针距还原：最终轮廓与独立线色检查</text>
<text x="110" y="929" class="small">AI 提供参数或复核意见；最终针脚由确定性引擎生成</text>
<rect x="950" y="420" width="590" height="565" rx="14" fill="#f0f2f6" stroke="#d4dce5" stroke-width="1.5"/>
<text x="980" y="458" class="section">其他业务入口与能力边界</text>
<rect x="980" y="480" width="530" height="73" rx="14" fill="#ffffff" stroke="#d7e2e8" stroke-width="1.5"/>
<text x="1000" y="511" class="label">OXS 导入 / 空白新建</text>
<text x="1000" y="538" class="detail">直接形成针脚文档；OXS 仅支持明确的全针子集</text>
<rect x="980" y="585" width="530" height="86" rx="14" fill="#ffffff" stroke="#d7e2e8" stroke-width="1.5"/>
<text x="1000" y="619" class="label">编辑与版本</text>
<text x="1000" y="647" class="detail">前端本地撤销 100 步；手动保存整份文档</text>
<rect x="980" y="703" width="530" height="97" rx="14" fill="#ffffff" stroke="#d7e2e8" stroke-width="1.5"/>
<text x="1000" y="737" class="label">账号、充值次数与支付适配器</text>
<text x="1000" y="767" class="detail">生成版本提交成功才扣 1 次；余额与账本入库</text>
<text x="1000" y="790" class="small">微信 / 支付宝 / Stripe 已有适配，真实联调待完成</text>
<rect x="980" y="835" width="530" height="112" rx="14" fill="#fff6e8" stroke="#dca455" stroke-width="1.5" stroke-dasharray="9 6"/>
<text x="1000" y="870" class="label">任务队列：存储与 API 已实现</text>
<text x="1000" y="900" class="detail">领取、租约、心跳、取消已有底座</text>
<text x="1000" y="930" class="small">独立执行器未接入；通用任务仍停留在 QUEUED</text>
<path d="M 1510 517 H 1565 V 1068 H 1540" class="edge"/>
<path d="M 1510 628 H 1565" class="edge"/>
<path d="M 485 945 V 1020" class="edge"/>
<rect x="60" y="1020" width="1480" height="99" rx="14" fill="#eeebfb" stroke="#c6bfe7" stroke-width="1.5"/>
<text x="90" y="1058" class="section">04  统一作品数据  ·  PatternDocument + 不可变 Revision</text>
<text x="90" y="1095" class="detail">网格 / 配方索引 / 材料快照 / 布料 / 区域策略 / 来源信息；保存时检查当前版本，生成扣次与版本同事务提交</text>
<path d="M 340 1119 V 1157" class="edge"/>
<path d="M 885 1119 V 1157" class="edge"/>
<path d="M 1330 1119 V 1157" class="edge"/>
<rect x="60" y="1157" width="580" height="139" rx="14" fill="#ffffff" stroke="#d7e2e8" stroke-width="1.5"/>
<text x="85" y="1193" class="label">SQLite  ·  metadata.sqlite3</text>
<text x="85" y="1225" class="detail">项目、版本 JSON、任务、命令、账号、订单、账本</text>
<text x="85" y="1258" class="small">用户对应独立工作区；WAL 与事务保护一致性</text>
<rect x="675" y="1157" width="420" height="139" rx="14" fill="#ffffff" stroke="#d7e2e8" stroke-width="1.5"/>
<text x="700" y="1193" class="label">本地内容寻址存储</text>
<text x="700" y="1225" class="detail">artifacts/sha256 · 按哈希保存素材</text>
<text x="700" y="1258" class="small">转换阶段写入；版本记录素材引用</text>
<rect x="1130" y="1157" width="410" height="139" rx="14" fill="#ffffff" stroke="#d7e2e8" stroke-width="1.5"/>
<text x="1155" y="1193" class="label">从同一版本导出</text>
<text x="1155" y="1225" class="detail">网页：OXS / 完整 PNG 图纸</text>
<text x="1155" y="1258" class="small">CLI：另有 PDF / CSV / 工程包等</text>
<text x="60" y="1342" class="small">实线：当前主链路    ·    橙色虚线框：底座已写、执行能力尚未接通    ·    图中省略手动参数与部分错误处理分支</text>
<text x="60" y="1374" class="small">审查重点：锁定约束一致性 → 任务执行与恢复 → 编辑持久化 → 缓存、数据库读锁和大图性能</text>
<rect x="60" y="1410" width="720" height="130" rx="14" fill="#ffffff" stroke="#d7e2e8"/>
<text x="85" y="1450" class="label">最重要的数据原则</text>
<text x="85" y="1484" class="detail">作品本体是针脚文档；图片只是输入或展示产物。</text>
<text x="85" y="1516" class="detail">版本号用于防止旧编辑、过期生成结果覆盖新内容。</text>
<rect x="820" y="1410" width="720" height="130" rx="14" fill="#ffffff" stroke="#d7e2e8"/>
<text x="845" y="1450" class="label">建议优先补齐的两处</text>
<text x="845" y="1484" class="detail">所有保存入口统一执行 locked 区域约束。</text>
<text x="845" y="1516" class="detail">将同步生成接到已有任务底座，支持限流、恢复与取消。</text>
</svg>